[package]
name = "VoiceBridge"
version = "0.1.0"
edition = "2024"
description = "VoiceBridge — Real-time Speech-to-Text-to-Translate pipeline with local Metal GPU acceleration, multi-model ASR, and OBS Studio transparent overlay."
readme = "README.md"
license = "MIT"
keywords = ["speech-to-text", "whisper", "translation", "obs", "gpui"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
gpui-kit = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0" }
