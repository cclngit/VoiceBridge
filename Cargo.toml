[package]
name = "VoiceBridge"
version = "0.3.0"
edition = "2024"
build = "build.rs"
description = "VoiceBridge — Real-time Speech-to-Text-to-Translate pipeline with local Metal/CUDA/Vulkan GPU acceleration, multi-model ASR, and OBS Studio transparent overlay."
readme = "README.md"
license = "MIT"
keywords = ["speech-to-text", "whisper", "translation", "obs", "kyutai"]
categories = ["multimedia::audio", "command-line-utilities"]

[features]
default = []
# Optional GPU acceleration backends for Windows & Linux (macOS enables Metal automatically)
cuda = [
    "whisper-rs/cuda",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "moshi/cuda",
]
metal = [
    "whisper-rs/metal",
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "moshi/metal",
]
vulkan = ["whisper-rs/vulkan"]
hipblas = ["whisper-rs/hipblas"]
openmp = ["whisper-rs/openmp"]
# Optional Apple Neural Engine encoder support on macOS
coreml = ["whisper-rs/coreml"]

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.7"
gpui-kit = "0.8.1"
whisper-rs = { version = "0.16.0", features = ["raw-api"] }

# Kyutai (Moshi / Mimi / STT / Hibiki) + MADLAD-400 local translation — Candle ML stack.
# Candle is pinned to the 0.9 series required by the official `moshi` crate so tensors
# and devices can be shared between Kyutai models and the local T5 translator.
candle-core = { version = "0.9.1", default-features = false }
candle-nn = { version = "0.9.1", default-features = false }
candle-transformers = { version = "0.9.1", default-features = false }
moshi = "0.6.4"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
rubato = "0.16.2"
sha2 = "0.10.9"
toml = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal", "raw-api"] }
# Metal acceleration for Kyutai STT / Hibiki / MADLAD on Apple Silicon.
candle-core = { version = "0.9.1", default-features = false, features = ["metal"] }
candle-nn = { version = "0.9.1", default-features = false, features = ["metal"] }
candle-transformers = { version = "0.9.1", default-features = false, features = ["metal"] }
moshi = { version = "0.6.4", features = ["metal"] }

[build-dependencies]
embed-resource = "3.0.12"
