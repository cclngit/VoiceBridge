name: Build & Package (.dmg / .deb / .exe — x86_64 & ARM64)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Build portable CPU kernels (SSE4.2/AVX2 on x86_64, ARMv8 NEON on ARM64) rather than
  # locking binaries to the CI runner host CPU via -march=native.
  GGML_NATIVE: "OFF"

jobs:
  build:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS (.dmg Disk Images: ARM64 & Universal2) ────────────
          - os: macos-15
            label: macOS ARM64 (.dmg)
            artifact: VoiceBridge-macos-arm64
            target: aarch64-apple-darwin
            universal_macos: false
            bin: VoiceBridge
            pkg_glob: dist/VoiceBridge-macos-arm64.dmg

          - os: macos-15
            label: macOS Universal (.dmg — ARM64 + Intel x86_64)
            artifact: VoiceBridge-macos-universal
            target: universal-apple-darwin
            universal_macos: true
            bin: VoiceBridge
            pkg_glob: dist/VoiceBridge-macos-universal.dmg

          # ── Linux (.deb Debian/Ubuntu Packages via dpkg-deb) ────────
          - os: ubuntu-24.04
            label: Linux x86_64 (.deb amd64)
            artifact: VoiceBridge-linux-amd64
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            universal_macos: false
            bin: VoiceBridge
            pkg_glob: dist/VoiceBridge-linux-amd64.deb

          - os: ubuntu-24.04-arm
            label: Linux ARM64 (.deb arm64)
            artifact: VoiceBridge-linux-arm64
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            universal_macos: false
            bin: VoiceBridge
            pkg_glob: dist/VoiceBridge-linux-arm64.deb

          # ── Windows (.exe Inno Setup Installer & Standalone .exe) ───
          - os: windows-latest
            label: Windows x86_64 (.exe Setup & Portable)
            artifact: VoiceBridge-windows-x86_64
            target: x86_64-pc-windows-msvc
            inno_arch: x64compatible
            universal_macos: false
            bin: VoiceBridge.exe
            pkg_glob: dist/VoiceBridge-windows-x86_64*.exe

          - os: windows-11-arm
            label: Windows ARM64 (.exe Setup & Portable)
            artifact: VoiceBridge-windows-arm64
            target: aarch64-pc-windows-msvc
            inno_arch: arm64
            universal_macos: false
            bin: VoiceBridge.exe
            pkg_glob: dist/VoiceBridge-windows-arm64*.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (x86_64 & ARM64)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            build-essential \
            cmake \
            pkg-config \
            clang \
            libclang-dev \
            libssl-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libxcb-xkb-dev \
            libxcb-xinput-dev \
            libxcb-icccm4-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libdbus-1-dev \
            libvulkan-dev

      - name: Setup NASM on Windows x86_64 (for aws-lc-sys)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/setup-nasm@v1

      - name: Setup MSVC ARM64 Developer Environment on Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Configure Windows SDK tools (fxc.exe, rc.exe) & architecture-matched LLVM / Clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-PeMachine([string]$FilePath) {
            if (-not (Test-Path $FilePath)) { return 0 }
            $bytes = New-Object byte[] 4096
            $fs = [System.IO.File]::OpenRead($FilePath)
            try {
              $read = $fs.Read($bytes, 0, $bytes.Length)
              if ($read -lt 64) { return 0 }
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              if ($peOffset -lt 0 -or ($peOffset + 6) -gt $read) { return 0 }
              return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            } finally {
              $fs.Close()
            }
          }

          $isArm64Target = ("${{ matrix.target }}" -eq "aarch64-pc-windows-msvc")
          $hostArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          # 0xAA64 = ARM64, 0x8664 = AMD64 (x64)
          $expectedMachine = if ($hostArch -eq "Arm64") { 0xAA64 } else { 0x8664 }
          Write-Host "Windows host OSArchitecture=$hostArch (expected PE machine=0x$($expectedMachine.ToString('X4'))), target=${{ matrix.target }}"

          # 1. Locate Windows SDK tools explicitly (GPUI_FXC_PATH for gpui-pre-windows, RC for embed-resource)
          $kitsBinRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $sdkArchOrder = if ($hostArch -eq "Arm64") { @("arm64", "x64") } else { @("x64", "x86") }

          function Find-SdkTool([string]$ToolName) {
            if (-not (Test-Path $kitsBinRoot)) { return $null }
            $verDirs = Get-ChildItem -Path $kitsBinRoot -Directory -Filter "10.*" |
              Sort-Object { [version]($_.Name -replace '[^0-9\.]', '') } -Descending
            foreach ($archDir in $sdkArchOrder) {
              foreach ($verDir in $verDirs) {
                $candidate = Join-Path $verDir.FullName "$archDir\$ToolName"
                if (Test-Path $candidate) { return $candidate }
              }
            }
            return $null
          }

          $fxcPath = Find-SdkTool "fxc.exe"
          if ($fxcPath) {
            echo "GPUI_FXC_PATH=$fxcPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Configured GPUI_FXC_PATH=$fxcPath"
          } else {
            throw "Failed to locate fxc.exe in $kitsBinRoot"
          }

          $rcPath = Find-SdkTool "rc.exe"
          if ($rcPath) {
            echo "RC=$rcPath" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Configured RC=$rcPath"
          }

          $mtPath = Find-SdkTool "mt.exe"

          # 2. Discover Visual Studio installations (including VS 2022 & VS 2026 Enterprise/Preview)
          $vsInstallDirs = New-Object System.Collections.Generic.List[string]
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $detected = & $vswhere -products * -prerelease -property installationPath 2>$null
            foreach ($p in $detected) {
              if ($p -and (Test-Path $p)) { $vsInstallDirs.Add($p.Trim()) }
            }
          }
          foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
            if ($root -and (Test-Path "$root\Microsoft Visual Studio")) {
              Get-ChildItem -Path "$root\Microsoft Visual Studio\*\*" -Directory -ErrorAction SilentlyContinue |
                ForEach-Object {
                  if (-not $vsInstallDirs.Contains($_.FullName)) { $vsInstallDirs.Add($_.FullName) }
                }
            }
          }

          # 3. Locate an architecture-matched LLVM bin directory containing libclang.dll (+ clang.exe & clang-cl.exe on ARM64)
          $llvmCandidates = New-Object System.Collections.Generic.List[string]
          if ($hostArch -eq "Arm64") {
            foreach ($vs in $vsInstallDirs) {
              $llvmCandidates.Add("$vs\VC\Tools\Llvm\ARM64\bin")
            }
            $llvmCandidates.Add("C:\Program Files\LLVM\bin")
          } else {
            $llvmCandidates.Add("C:\Program Files\LLVM\bin")
            foreach ($vs in $vsInstallDirs) {
              $llvmCandidates.Add("$vs\VC\Tools\Llvm\x64\bin")
            }
          }

          $selectedLlvmBin = $null
          foreach ($dir in $llvmCandidates) {
            $dll = Join-Path $dir "libclang.dll"
            if (Test-Path $dll) {
              $machine = Get-PeMachine $dll
              Write-Host "Inspecting $dll -> PE machine 0x$($machine.ToString('X4'))"
              if ($machine -eq $expectedMachine) {
                if (-not $isArm64Target -or ((Test-Path (Join-Path $dir "clang-cl.exe")) -and (Test-Path (Join-Path $dir "clang.exe")))) {
                  $selectedLlvmBin = $dir
                  break
                }
              }
            }
          }

          # Fallback: install official native Windows-on-ARM LLVM if runner lacks ARM64 libclang.dll / clang-cl.exe
          if (-not $selectedLlvmBin -and $hostArch -eq "Arm64") {
            Write-Host "Native ARM64 libclang.dll + clang-cl.exe not found; installing official LLVM (woa64)..."
            $llvmExe = Join-Path $env:RUNNER_TEMP "LLVM-woa64.exe"
            $llvmDir = Join-Path $env:RUNNER_TEMP "LLVM-arm64"
            Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-woa64.exe" -OutFile $llvmExe
            $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue)?.Source
            if (-not $sevenZip -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
              $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            }
            if ($sevenZip) {
              & $sevenZip x $llvmExe "-o$llvmDir" -y | Out-Null
            }
            $extractedDll = Join-Path $llvmDir "bin\libclang.dll"
            if ((Test-Path $extractedDll) -and ((Get-PeMachine $extractedDll) -eq $expectedMachine)) {
              $selectedLlvmBin = Join-Path $llvmDir "bin"
            } else {
              Start-Process -FilePath $llvmExe -ArgumentList "/S", "/D=$llvmDir" -Wait
              $extractedDll = Join-Path $llvmDir "bin\libclang.dll"
              if ((Test-Path $extractedDll) -and ((Get-PeMachine $extractedDll) -eq $expectedMachine)) {
                $selectedLlvmBin = Join-Path $llvmDir "bin"
              }
            }
          }

          if (-not $selectedLlvmBin) {
            throw "Failed to locate architecture-matched libclang.dll (expected PE machine 0x$($expectedMachine.ToString('X4')))"
          }

          echo "LIBCLANG_PATH=$selectedLlvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          $matchingClangExe = Join-Path $selectedLlvmBin "clang.exe"
          if (Test-Path $matchingClangExe) {
            echo "CLANG_PATH=$matchingClangExe" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          echo "$selectedLlvmBin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Configured LIBCLANG_PATH=$selectedLlvmBin"

          # 4. Windows ARM64 C/C++ & CMake toolchain configuration (whisper.cpp/ggml, aws-lc-sys, ring)
          if ($isArm64Target) {
            if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              foreach ($vs in $vsInstallDirs) {
                $vsNinja = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
                if (Test-Path (Join-Path $vsNinja "ninja.exe")) {
                  echo "$vsNinja" | Out-File -FilePath $env:GITHUB_PATH -Append
                  Write-Host "Added Ninja from $vsNinja"
                  break
                }
              }
            }

            $clangClPath = (Join-Path $selectedLlvmBin "clang-cl.exe").Replace('\', '/')
            $clangPath   = (Join-Path $selectedLlvmBin "clang.exe")

            # Verify clang can parse standard Windows/CRT headers for bindgen & ring before starting Cargo
            "#include <stdint.h>`n#include <stdio.h>`nint main(void) { return 0; }" |
              & $clangPath --target=aarch64-pc-windows-msvc -fsyntax-only -x c -
            if ($LASTEXITCODE -ne 0) {
              throw "clang preflight header check failed with exit code $LASTEXITCODE"
            }
            Write-Host "Verified clang.exe + MSVC/SDK headers for aarch64-pc-windows-msvc"

            # Use CC_PREFER_CLANG_CL_OVER_MSVC=1 rather than global CC=clang-cl so:
            # - ring-0.17.14 uses clang.exe for GNU .S assembly files
            # - aws-lc-sys & cc-rs crates use clang-cl.exe
            # - whisper-rs-sys CMake+Ninja uses explicit forward-slash clang-cl.exe paths
            $cmakeEnv = @(
              "CC_PREFER_CLANG_CL_OVER_MSVC=1",
              "CMAKE_GENERATOR=Ninja",
              "CMAKE_C_COMPILER=$clangClPath",
              "CMAKE_CXX_COMPILER=$clangClPath",
              "CMAKE_ASM_COMPILER=$clangClPath"
            )
            if ($rcPath) {
              $cmakeEnv += "CMAKE_RC_COMPILER=$($rcPath.Replace('\', '/'))"
            }
            if ($mtPath) {
              $cmakeEnv += "CMAKE_MT=$($mtPath.Replace('\', '/'))"
            }
            $cmakeEnv | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Install Rust stable toolchain (single target)
        if: ${{ !matrix.universal_macos }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust stable toolchain (macOS Universal arm64 + x86_64)
        if: ${{ matrix.universal_macos }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (single target)
        if: ${{ !matrix.universal_macos }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build macOS Universal2 binary (ARM64 + x86_64 via lipo)
        if: ${{ matrix.universal_macos }}
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/VoiceBridge \
            target/x86_64-apple-darwin/release/VoiceBridge \
            -output target/universal-apple-darwin/release/VoiceBridge
          codesign --force --sign - target/universal-apple-darwin/release/VoiceBridge
          lipo -info target/universal-apple-darwin/release/VoiceBridge

      - name: Run unit tests
        if: ${{ !matrix.universal_macos }}
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Smoke test CLI on Unix (--help)
        if: runner.os != 'Windows'
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --help

      - name: Smoke test CLI on Windows (--help)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\${{ matrix.target }}\release\${{ matrix.bin }} --help

      - name: Build macOS .dmg Disk Image (VoiceBridge.app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9] ]]; then
            PKG_VERSION="${GITHUB_REF_NAME#v}"
          else
            PKG_VERSION="0.1.0"
          fi
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh \
            "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
            "dist/${{ matrix.artifact }}.dmg" \
            "$PKG_VERSION"

      - name: Build Linux .deb Package (dpkg-deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9] ]]; then
            PKG_VERSION="${GITHUB_REF_NAME#v}"
          else
            PKG_VERSION="0.1.0"
          fi
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh \
            "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
            "${{ matrix.deb_arch }}" \
            "dist/${{ matrix.artifact }}.deb" \
            "$PKG_VERSION"

      - name: Build Windows .exe Setup Installer (Inno Setup 6) & Standalone .exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -match '^v[0-9]') {
            $pkgVersion = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $pkgVersion = "0.1.0"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          # 1. Copy standalone single-file portable .exe
          Copy-Item "target\${{ matrix.target }}\release\VoiceBridge.exe" "dist\${{ matrix.artifact }}.exe" -Force

          # 2. Locate or install Inno Setup 6 (ISCC.exe) to compile Setup .exe
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc -and (Get-Command choco -ErrorAction SilentlyContinue)) {
            choco install innosetup -y
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $innoTmp = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            $innoDir = Join-Path $env:RUNNER_TEMP "InnoSetup6"
            Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.4.2.exe" -OutFile $innoTmp
            Start-Process -FilePath $innoTmp -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=$innoDir" -Wait
            $iscc = Join-Path $innoDir "ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Failed to locate or install ISCC.exe (Inno Setup 6)"
          }

          $binRel = "..\..\target\${{ matrix.target }}\release\VoiceBridge.exe"
          & $iscc `
            "/DMyAppVersion=$pkgVersion" `
            "/DMyArch=${{ matrix.inno_arch }}" `
            "/DMyBinaryPath=$binRel" `
            "/DMyOutputBaseFilename=${{ matrix.artifact }}-setup" `
            "packaging\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe failed with exit code $LASTEXITCODE"
          }

      - name: Upload CI package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pkg_glob }}
          if-no-files-found: error

  release:
    name: Create GitHub Release (All Installers + Checksums + Source)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packaged installers (.dmg, .deb, .exe)
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          ls -lh
          sha256sum VoiceBridge-* | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoiceBridge ${{ github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: |
            release-assets/VoiceBridge-*
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
